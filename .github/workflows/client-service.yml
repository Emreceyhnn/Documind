name: Client Service (Next.js) CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'documind-client/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'documind-client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documind-client
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: documind-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
