name: Auth Service CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Auth.Service/**'
      - 'Auth.Service.Test/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Auth.Service/**'
      - 'Auth.Service.Test/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Auth.Service/Auth.Service.csproj

      - name: Build Auth Service
        run: dotnet build Auth.Service/Auth.Service.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Auth.Service.Test/Auth.Service.Test.csproj --no-build --verbosity normal
