name: Auth Service CI/CD & Deploy

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Auth.Service/**'
      - 'Auth.Service.Test/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Auth.Service/**'
      - 'Auth.Service.Test/**'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Auth.Service/Auth.Service.csproj

      - name: Build Auth Service
        run: dotnet build Auth.Service/Auth.Service.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Auth.Service.Test/Auth.Service.Test.csproj --no-build --verbosity normal

  publish-and-deploy:
    name: Docker Publish & Deploy to VPS
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy edilecek immutable image tag'ini hesapla
        id: image
        run: |
          echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Auth.Service
          file: ./Auth.Service/Dockerfile
          push: true
          tags: |
            emrecyhn/documind-auth-service:${{ steps.image.outputs.sha_short }}
            emrecyhn/documind-auth-service:latest

      - name: SSH and Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          envs: IMAGE_TAG,PRODUCTION_ENV_FILE
          script: |
            set -e
            cd ${{ secrets.VPS_TARGET_DIR || '/home/documind' }}

            printf '%s' "$PRODUCTION_ENV_FILE" > .env

            docker pull emrecyhn/documind-auth-service:${IMAGE_TAG}
            docker tag emrecyhn/documind-auth-service:${IMAGE_TAG} emrecyhn/documind-auth-service:latest
            docker compose up -d auth-service
            docker image prune -f

            for i in $(seq 1 10); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:5083/health" || echo "000")
              if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ]; then
                echo "Deploy başarılı, servis ayakta (HTTP $STATUS)."
                exit 0
              fi
              echo "Bekleniyor... deneme $i (HTTP $STATUS)"
              sleep 5
            done
            echo "Health check tamamlandı."
        env:
          IMAGE_TAG: ${{ steps.image.outputs.sha_short }}
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
