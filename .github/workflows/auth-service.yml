name: Auth Service CI/CD & Docker Push/Deploy

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Auth.Service/**'
      - 'Auth.Service.Test/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Auth.Service/**'
      - 'Auth.Service.Test/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: emreceyhnn/documind-auth-service

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Auth.Service/Auth.Service.csproj

      - name: Build Auth Service
        run: dotnet build Auth.Service/Auth.Service.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test Auth.Service.Test/Auth.Service.Test.csproj --no-build --verbosity normal

  build-and-push:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Auth.Service
          file: ./Auth.Service/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.VPS_TARGET_DIR || '~/Documind' }}
            docker compose pull auth-service
            docker compose up -d auth-service
            docker image prune -f
