name: Document Service CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Document.Service/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Document.Service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Document.Service/Document.Service.csproj

      - name: Build Document Service
        run: dotnet build Document.Service/Document.Service.csproj --configuration Release --no-restore
