name: RAG Service CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'RAG.service/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'RAG.service/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore RAG.service/RAG.service.csproj

      - name: Build RAG Service
        run: dotnet build RAG.service/RAG.service.csproj --configuration Release --no-restore
