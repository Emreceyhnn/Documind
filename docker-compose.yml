services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: documind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: documind-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_PORT_CONSOLE}:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./Auth.Service
      dockerfile: Dockerfile
    image: ghcr.io/emreceyhnn/documind-auth-service:latest
    container_name: documind-auth-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5083
      - Database__Host=postgres
      - Database__Port=5432
      - Database__Username=${POSTGRES_USER}
      - Database__Password=${POSTGRES_PASSWORD}
      - Database__Name=${POSTGRES_DB}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy

  rag-service:
    build:
      context: ./RAG.service
      dockerfile: Dockerfile
    image: ghcr.io/emreceyhnn/documind-rag-service:latest
    container_name: documind-rag-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - Database__Host=postgres
      - Database__Port=5432
      - Database__Username=${POSTGRES_USER}
      - Database__Password=${POSTGRES_PASSWORD}
      - Database__Name=${POSTGRES_DB}
      - Minio__ServiceUrl=http://minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Minio__BucketName=${MINIO_BUCKET_NAME}
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
      - Gemini__ApiKey=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  document-service:
    build:
      context: ./Document.Service
      dockerfile: Dockerfile
    image: ghcr.io/emreceyhnn/documind-document-service:latest
    container_name: documind-document-service
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT}
      - ASPNETCORE_URLS=http://+:5025
      - Database__Host=postgres
      - Database__Port=5432
      - Database__Username=${POSTGRES_USER}
      - Database__Password=${POSTGRES_PASSWORD}
      - Database__Name=${POSTGRES_DB}
      - Minio__ServiceUrl=http://minio:9000
      - Minio__AccessKey=${MINIO_ROOT_USER}
      - Minio__SecretKey=${MINIO_ROOT_PASSWORD}
      - Minio__BucketName=${MINIO_BUCKET_NAME}
      - Rag__ApiUrl=http://rag-service:5110
      - Rag__GrpcUrl=http://rag-service:5111
      - JwtSettings__SecretKey=${JWT_SECRET_KEY}
      - JwtSettings__Issuer=${JWT_ISSUER}
      - JwtSettings__Audience=${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      rag-service:
        condition: service_started

  client:
    build:
      context: ./documind-client
      dockerfile: Dockerfile
    image: ghcr.io/emreceyhnn/documind-client:latest
    container_name: documind-client
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - AUTH_API_URL=http://auth-service:5083
      - DOCUMENT_API_URL=http://document-service:5025
      - RAG_API_URL=http://rag-service:5110
    depends_on:
      - auth-service
      - document-service
      - rag-service

  nginx:
    image: nginx:1.27-alpine
    container_name: documind-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - auth-service
      - document-service
      - rag-service

volumes:
  postgres_data:
  minio_data:
